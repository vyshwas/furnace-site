<style>
  :root {
    --bg: #FFFFFF;
    --ink: #09090B;
    --ink-secondary: #52525B;
    --ink-muted: #71717A;
    --line: #E4E4E7;
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Geist Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 480px;
  }
  .badge {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-muted);
    margin-bottom: 16px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 500;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
  }
  p {
    font-size: 0.95rem;
    color: var(--ink-secondary);
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ink);
    color: #FFFFFF;
    border: 1px solid var(--ink);
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .btn:hover {
    background: #27272A;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">404 &middot; NOT FOUND</div>
    <h1>This surface does not exist.</h1>
    <p>
      The page you requested could not be located in the verified index. Like an unprovable state, it is quarantined.
    </p>
    <a href="./" class="btn">
      &larr; Back to Furnace Home
    </a>
  </div>
