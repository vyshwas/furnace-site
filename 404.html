<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not Found &middot; Furnace Labs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23121211'/><text x='50%' y='68%' font-size='56' text-anchor='middle' fill='%23EA580C' font-family='serif' font-style='italic' font-weight='bold'>F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5F0;
    --paper-card: #FFFFFF;
    --ink: #111110;
    --ink-muted: #5C5B56;
    --line: #E0DDD4;
    --flame: #C2410C;
    --serif: "Newsreader", Georgia, serif;
    --sans: "Plus Jakarta Sans", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 48px 36px;
    max-width: 520px;
    box-shadow: 0 20px 40px -15px rgba(0,0,0,0.06);
  }
  .glyph {
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--flame);
    margin-bottom: 12px;
  }
  h1 {
    font-family: var(--serif);
    font-size: 3rem;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  h1 em {
    font-style: italic;
    color: var(--flame);
  }
  p {
    color: var(--ink-muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  a.btn:hover {
    background: var(--flame);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">Error State &middot; 404</div>
    <h1>Missing <em>route</em>.</h1>
    <p>The path you requested does not exist on this host. Furnace is local-first: this public site provides only the verified alpha installation apparatus and proving ledgers.</p>
    <a href="./" class="btn">Return to Furnace Labs</a>
  </div>
</body>
</html>
