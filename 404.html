<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not Found · Furnace Labs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C2410C'/><text x='50%' y='68%' font-size='60' text-anchor='middle' fill='%23FAF9F7' font-family='monospace' font-weight='bold'>F</text></svg>">
<style>
  :root {
    --paper: #FAF9F7;
    --ink: #1C1C1A;
    --muted: #5F5F5C;
    --line: #E5E3DE;
    --heat: #C2410C;
    --sans: "Inter", "Geist Sans", -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Geist Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 1.05rem; line-height: 1.65;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  main { max-width: 48ch; }
  .code { font-family: var(--mono); font-size: 3rem; font-weight: 700; color: var(--heat); margin: 0 0 8px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  p { color: var(--muted); margin: 0 0 24px; font-size: 1rem; }
  a {
    display: inline-block; font-family: var(--mono); font-size: 0.9rem;
    color: #fff; background: var(--ink); padding: 10px 20px;
    border-radius: 999px; text-decoration: none; font-weight: 600;
  }
  a:hover { background: var(--heat); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you requested does not exist. Furnace is local-first: the website only hosts the installation command and documentation.</p>
  <a href="./">Return to Furnace Labs</a>
</main>
</body>
</html>
